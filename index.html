<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра Престолов — Все сезоны на русском</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0d12;
            --bg-card: #141822;
            --bg-hover: #1e2433;
            --gold: #d4af37;
            --gold-bright: #ffd700;
            --silver: #c0c0c0;
            --text-main: #e0e6ed;
            --text-muted: #8a99ad;
            --border-color: #232a3b;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        .header { background: rgba(11, 13, 18, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); padding: 15px 0; }
        .header-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
        
        .hero { padding: 40px 0 20px; text-align: center; }
        .hero-title { font-family: 'Cinzel', serif; font-size: 2.2rem; color: var(--gold); margin-bottom: 10px; }
        .hero-subtitle { color: var(--silver); font-style: italic; font-size: 0.9rem; margin-bottom: 20px; }

        .section { padding: 20px 0; }
        .section-title { font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--gold); margin-bottom: 20px; text-align: center; }

        .season-tabs { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 25px; }
        .season-tab { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        .season-tab.active, .season-tab:hover { background: var(--gold); color: #000; border-color: var(--gold); }

        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .episode-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 15px; cursor: pointer; transition: 0.3s; text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: space-between; }
        .episode-card:hover { background: var(--bg-hover); border-color: var(--gold); transform: translateY(-3px); }
        
        .ep-num { color: var(--gold); font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; }
        .ep-title { font-size: 1rem; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .ep-desc { color: var(--text-muted); font-size: 0.8rem; line-height: 1.4; margin-bottom: 15px; }
        
        .watch-btn { background: linear-gradient(135deg, var(--gold), #997a15); color: #000; text-align: center; padding: 8px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }

        .footer { border-top: 1px solid var(--border-color); padding: 25px 0; text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 40px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <div class="logo">⚔️ ИГРА ПРЕСТОЛОВ</div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Онлайн Кинотеатр</h1>
            <p class="hero-subtitle">Выберите сезон и серию для просмотра в русской озвучке</p>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="season-tabs" id="seasonTabs"></div>
            <div class="episodes-grid" id="episodesGrid"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>Игра Престолов — Все права защищены</p>
        </div>
    </footer>

        let currentSeason = 1;

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            loadEpisodes(1);
        });

        function renderTabs() {
            const container = document.getElementById('seasonTabs');
            container.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const btn = document.createElement('button');
                btn.className = `season-tab ${i === currentSeason ? 'active' : ''}`;
                btn.innerText = `Сезон ${i}`;
                btn.onclick = () => {
                    currentSeason = i;
                    renderTabs();
                    loadEpisodes(i);
                };
                container.appendChild(btn);
            }
        }

        function loadEpisodes(seasonNum) {
            const grid = document.getElementById('episodesGrid');
            grid.innerHTML = '';
            seasonsData[seasonNum].forEach((ep) => {
                const card = document.createElement('a');
                card.className = 'episode-card';
                // Ссылка ведет на стабильный плеер с русской озвучкой
                card.href = `https://voidboost.net/embed/464963?season=${seasonNum}&episode=${ep.ep}`;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                
                card.innerHTML = `
                    <div>
                        <div class="ep-num">Серия ${ep.ep}</div>
                        <div class="ep-title">${ep.title}</div>
                        <div class="ep-desc">${ep.desc}</div>
                    </div>
                    <div class="watch-btn">▶ Смотреть</div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
