<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра Престолов — Смотреть онлайн без рекламы</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0d12;
            --bg-card: #141822;
            --bg-hover: #1e2433;
            --gold: #d4af37;
            --gold-bright: #ffd700;
            --silver: #c0c0c0;
            --text-main: #e0e6ed;
            --text-muted: #8a99ad;
            --border-color: #232a3b;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        
        /* Header */
        .header { background: rgba(11, 13, 18, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); padding: 15px 0; }
        .header-container { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Cinzel', serif; font-size: 1.3rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
        
        /* Hero */
        .hero { padding: 30px 0 15px; text-align: center; }
        .hero-title { font-family: 'Cinzel', serif; font-size: 2.2rem; color: var(--gold); margin-bottom: 5px; }
        .hero-subtitle { color: var(--silver); font-style: italic; font-size: 0.9rem; }

        /* Player */
        .section { padding: 25px 0; }
        .section-title { font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--gold); margin-bottom: 15px; text-align: center; }
        .player-wrapper { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Контейнер плеера с невидимым защитным слоем от кликов-рекламы */
        .player-container { position: relative; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .now-playing { margin-bottom: 15px; text-align: center; }
        .now-playing .label { font-size: 0.8rem; color: var(--text-muted); display: block; }
        .now-playing .title { font-size: 1.05rem; font-weight: 600; color: var(--gold-bright); }

        .control-buttons { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .btn { padding: 10px 22px; border-radius: var(--radius); border: none; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.3s; }
        .btn-secondary { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { border-color: var(--gold); background: var(--gold); color: #000; }

        /* Seasons & Episodes */
        .season-tabs { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
        .season-tab { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .season-tab.active, .season-tab:hover { background: var(--gold); color: #000; border-color: var(--gold); }

        .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
        .episode-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: 0.3s; }
        .episode-card:hover { background: var(--bg-hover); border-color: var(--gold); }
        .episode-card.active { border-color: var(--gold-bright); background: rgba(212, 175, 55, 0.1); }
        .ep-num { color: var(--gold); font-size: 0.75rem; font-weight: 700; margin-bottom: 3px; }
        .ep-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
        .ep-desc { color: var(--text-muted); font-size: 0.75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Footer */
        .footer { border-top: 1px solid var(--border-color); padding: 20px 0; text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 30px; }
    </style>
</head>
<body>

    <header class="header">
        <div class="container header-container">
            <div class="logo">⚔️ ИГРА ПРЕСТОЛОВ</div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Все сезоны онлайн</h1>
            <p class="hero-subtitle">Русская озвучка • Без рекламы</p>
        </div>
    </section>

    <!-- Плеер -->
    <section class="section" style="padding-top: 0;">
        <div class="container">
            <div class="player-wrapper">
                <div class="player-container">
                    <!-- Используем стабильный плеер с русской озвучкой -->
                    <iframe id="videoIframe" src="" allowfullscreen></iframe>
                </div>
                
                <div class="now-playing">
                    <span class="label">Сейчас воспроизводится:</span>
                    <span id="currentEpisodeTitle" class="title">Загрузка...</span>
                </div>
                
                <div class="control-buttons">
                    <button class="btn btn-secondary" onclick="changeEpisode(-1)">◄ Назад</button>
                    <button class="btn btn-secondary" onclick="changeEpisode(1)">Вперед ►</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Выбор сезонов и серий -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">Выберите сезон и серию</h2>
            <div class="season-tabs" id="seasonTabs"></div>
            <div class="episodes-grid" id="episodesGrid"></div>
        </div>

    <footer class="footer">
        <div class="container">
            <p>Игра Престолов — Онлайн Кинотеатр</p>
        </div>
    </footer>

                { ep: 2, title: "Тёмные крылья, тёмные вести", desc: "Бран встречает новых таинственных спутников." },
                { ep: 3, title: "Аллея наказаний", desc: "Дейнерис покупает армию Безупречных." },
                { ep: 4, title: "И теперь его дозор окончен", desc: "Расплата в Астапоре." },
                { ep: 5, title: "Поцелованная огнем", desc: "Испытания Бриенны и Джейме." },
                { ep: 6, title: "Подъем", desc: "Опасное восхождение на ледяную Стену." },
                { ep: 7, title: "Медведь и прекрасная дева", desc: "Спасение Бриенны из ямы." },

            4: [

                { ep: 4, title: "Верный клятве", desc: "Планы Серсеи и путешествие Бриенны." },
                { ep: 5, title: "Первый этого имени", desc: "Коронация Томмена." },
                { ep: 6, title: "Законы богов и людей", desc: "Великий суд над Тирионом Ланнистером." },
                { ep: 7, title: "Пересмешник", desc: "Оберин соглашается стать защитником Тириона." },
                { ep: 8, title: "Гора и Змей", desc: "Смертельный поединок в столице." },
                { ep: 9, title: "Дозорные на Стене", desc: "Нападение диких на Черный Замок." },

            ],
            5: [
                { ep: 1, title: "Грядущие войны", desc: "Новые угрозы для Семи Королевств." },

            6: [

                { ep: 4, title: "Книга Неопалимой", desc: "Встреча Сансы и Джона." },

                { ep: 6, title: "Кровь моей крови", desc: "Неожиданное спасение Брана." },
                { ep: 7, title: "Сломленный человек", desc: "Возвращение старых героев." },
                { ep: 8, title: "Никто", desc: "Окончание обучения Арьи." },
                { ep: 9, title: "Битва бастардов", desc: "Эпическое сражение за Винтерфелл." },
                { ep: 10, title: "Ветры зимы", desc: "Взрыв септы и коронация Серсеи." }
            ],
            7: [
                { ep: 1, title: "Драконий Камень", desc: "Возвращение Дейнерис на родину предков." },
                { ep: 2, title: "Бурерожденная", desc: "Подготовка к большой войне." },
                { ep: 3, title: "Правосудие королевы", desc: "Первая встреча Джона и Дейнерис." },
                { ep: 4, title: "Трофеи войны", desc: "Атака дракона на армию Ланнистеров." },
                { ep: 5, title: "Восточный Дозор", desc: "Сбор отряда для вылазки за Стену." },
                { ep: 6, title: "За Стеной", desc: "Смертельная схватка с армией мертвых." },
                { ep: 7, title: "Дракон и Волк", desc: "Крушение ледяной Стены." }
            ],
            8: [
                { ep: 1, title: "Винтерфелл", desc: "Воссоединение героев в родовом замке Старков." },
                { ep: 2, title: "Рыцарь Семи Королевств", desc: "Тихий вечер перед великой бурей." },
                { ep: 3, title: "Долгая Ночь", desc: "Ночь обороны Винтерфелла." },
                { ep: 4, title: "Последние из Старков", desc: "Потери и подготовка к походу на юг." },
                { ep: 5, title: "Колокола", desc: "Падение Королевской Гавани." },
                { ep: 6, title: "Железный Трон", desc: "Окончательная развязка истории." }
            ]
        };

        let currentSeason = 1;
        let currentEpisodeIndex = 0;

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            loadEpisodes(1);
            playEp(1, 0);
        });

        function renderTabs() {
            const container = document.getElementById('seasonTabs');
            container.innerHTML = '';
            for (let i = 1; i <= 8; i++) {
                const btn = document.createElement('button');
                btn.className = `season-tab ${i === currentSeason ? 'active' : ''}`;
                btn.innerText = `Сезон ${i}`;
                btn.onclick = () => {
                    currentSeason = i;
                    renderTabs();
                    loadEpisodes(i);
                };
                container.appendChild(btn);
            }
        }

        function loadEpisodes(seasonNum) {
            const grid = document.getElementById('episodesGrid');
            grid.innerHTML = '';
            seasonsData[seasonNum].forEach((ep, index) => {
                const card = document.createElement('div');
                card.className = `episode-card ${seasonNum === currentSeason && index === currentEpisodeIndex ? 'active' : ''}`;
                card.onclick = () => playEp(seasonNum, index);
                card.innerHTML = `
                    <div class="ep-num">Серия ${ep.ep}</div>
                    <div class="ep-title">${ep.title}</div>
                    <div class="ep-desc">${ep.desc}</div>
                `;
                grid.appendChild(card);
            });
        }

        function playEp(season, index) {
            currentSeason = season;
            currentEpisodeIndex = index;
            const epData = seasonsData[season][index];
            
            // Используем надежный русскоязычный источник кинобазы (Collaps / Ashdi через API Kinopoisk 464963)
            document.getElementById('videoIframe').src = `https://voidboost.net/embed/464963?season=${season}&episode=${epData.ep}`;
            document.getElementById('currentEpisodeTitle').innerText = `Сезон ${season}, Серия ${epData.ep}: ${epData.title}`;
            
            loadEpisodes(season);
        }

        function changeEpisode(dir) {
            let newIndex = currentEpisodeIndex + dir;
            const currentList = seasonsData[currentSeason];
            
            if (newIndex >= 0 && newIndex < currentList.length) {
                playEp(currentSeason, newIndex);
            } else if (dir > 0 && currentSeason < 8) {
                currentSeason++;
                renderTabs();
                playEp(currentSeason, 0);
            } else if (dir < 0 && currentSeason > 1) {
                currentSeason--;
                renderTabs();
                playEp(currentSeason, seasonsData[currentSeason].length - 1);
            }
        }
    </script>
</body>
</html>
